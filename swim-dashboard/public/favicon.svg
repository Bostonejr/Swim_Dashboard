<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>
  <!-- Swimmer figure -->
  <g fill="white">
    <!-- Head -->
    <circle cx="32" cy="38" r="8"/>
    <!-- Body/torso diving forward -->
    <ellipse cx="50" cy="42" rx="18" ry="7" transform="rotate(-15 50 42)"/>
    <!-- Front arm (reaching forward) -->
    <path d="M62 36 Q75 30 82 35" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Back arm -->
    <path d="M38 44 Q28 52 22 48" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M35 48 Q30 60 25 68" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M38 50 Q38 62 42 70" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Water waves -->
  <g fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round">
    <path d="M10 72 Q20 68 30 72 Q40 76 50 72 Q60 68 70 72 Q80 76 90 72"/>
    <path d="M10 82 Q20 78 30 82 Q40 86 50 82 Q60 78 70 82 Q80 86 90 82"/>
  </g>
</svg>
